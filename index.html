<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>사주풀이 + 노래 추천 v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"]{
      --bg-gradient: linear-gradient(180deg, #1d2b4b, #0b1020);
      --bg-pattern: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgdmlld0JveD0iMCAwIDEwMCAxMDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGcgZmlsbD0ibm9uZSIgc3Ryb2tlPSJyZ2JhKDE0MiwgMTcwLCAyNTUsIDAuMSkiIHN0cm9rZS13aWR0aD0iMC41Ij48cGF0aCBkPSJNMCA1MCBMMTAwIDUwIE01MCAwIEw1MCAxMDAiLz48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSIyIi8+PGNpcmNsZSBjeD0iMTAiIGN5PSI5MCIgcj0iMSIvPjxjaXJjbGUgY3g9IjkwIiBjeT0iMTAiIHI9IjEiLz48L2c+PC9zdmc+');
      --bg: var(--bg-pattern), var(--bg-gradient);
      --card: rgba(18, 26, 51, 0.85);
      --line: rgba(173, 191, 255, 0.15);
      --muted: rgba(255, 255, 255, 0.55);
      --text: #fff;
      --accent: #7c66d9;
      --danger: rgba(255, 80, 80, 0.18);
      --danger-line: rgba(255, 80, 80, 0.35);
      --input-bg: #0b1020;
      --pillar-bg: rgba(142, 170, 255, 0.05);
      --highlight: rgba(124, 102, 217, 0.12);
      --music-bg: rgba(124, 102, 217, 0.08);
      --music-line: rgba(124, 102, 217, 0.2);
      --link: #cfe0ff;
      --toggle-bg: rgba(255, 255, 255, 0.10);
      --toggle-text: rgba(255, 255, 255, 0.85);
      --luck-bar-bg: rgba(255, 255, 255, 0.08);
      --section-title: #a391f7;
      --fortune-bg: rgba(142, 170, 255, 0.04);
      --fortune-hover: rgba(142, 170, 255, 0.08);
    }
    :root[data-theme="light"]{
      --bg: linear-gradient(180deg, #f0f5ff, #e6e9f0);
      --card:#fff;
      --line:rgba(0,0,0,.10);
      --muted:rgba(0,0,0,.50);
      --text:#1a1a1a;
      --accent:#5a48a3;
      --danger:rgba(255,80,80,.12);
      --danger-line:rgba(255,80,80,.30);
      --input-bg:#f7f8fa;
      --pillar-bg:rgba(0,0,0,.03);
      --highlight:rgba(90, 72, 163, 0.08);
      --music-bg:rgba(90, 72, 163, 0.06);
      --music-line:rgba(90, 72, 163, 0.15);
      --link:#5a48a3;
      --toggle-bg:rgba(0,0,0,.06);
      --toggle-text:rgba(0,0,0,.70);
      --luck-bar-bg:rgba(0,0,0,.06);
      --section-title:#5a48a3;
      --fortune-bg:rgba(0,0,0,.03);
      --fortune-hover:rgba(0,0,0,.06)
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Noto Sans KR',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:20px;transition:color .3s, background .3s}
    .card{
      width:min(800px,96vw);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:24px;
      box-shadow:0 22px 60px rgba(0,0,0,.25);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      transition:background .3s, border .3s, box-shadow .3s;
    }
    .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .top-bar h1{margin:0;font-size:24px;font-weight:700;}
    .theme-toggle{border:none;border-radius:10px;padding:7px 14px;background:var(--toggle-bg);color:var(--toggle-text);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;width:auto;margin-top:0;transition: all 0.3s ease;flex-shrink: 0;}
    .theme-toggle:hover{transform:translateY(-2px)}
    .subtitle{font-size:13px;color:var(--muted);margin-bottom:14px}
    .tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:2px solid var(--line);padding-bottom:0}
    .tab-btn{border:none;background:none;color:var(--muted);font-size:14px;font-weight:600;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;margin-bottom:-2px;width:auto;margin-top:0}
    .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
    .tab-pane{display:none}.tab-pane.active{display:block}
    .form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .form-group{display:flex;flex-direction:column;gap:4px}
    .form-group.full{grid-column:1/-1}
    label{font-size:13px;color:var(--muted)}
    input,select,textarea{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:var(--input-bg);
      color:var(--text);outline:none;
      font-size:14px;
      transition:background .3s,color .3s, border .3s;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    input:focus,select:focus,textarea:focus{border-color:var(--accent)}
    select option{background:var(--input-bg);color:var(--text)}
    .calendar-row{display:flex;gap:8px;margin-top:4px}
    .calendar-row label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text);cursor:pointer}
    .calendar-row input[type="radio"]{width:auto;accent-color:var(--accent)}
    button{border:none;border-radius:12px;padding:12px 18px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer;width:100%;margin-top:14px;transition: all 0.3s ease;}
    button:hover{filter:brightness(1.2);transform:translateY(-2px);}
    button:disabled{opacity:.6;cursor:not-allowed; filter:brightness(1); transform:none;}
    .err{display:none;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--danger);border:1px solid var(--danger-line);color:var(--text);font-size:13px}
    .section{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
    .section-title{font-size:16px;font-weight:700;margin:0 0 12px;color:var(--section-title)}
    .pillar-wrap{display:flex;justify-content:center;gap:12px;margin:16px 0;flex-wrap:wrap}
    .pillar{text-align:center;background:var(--pillar-bg);border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:90px}
    .pillar .plabel{font-size:11px;color:var(--muted);margin-bottom:6px}
    .pillar .gan{font-size:22px;font-weight:700;line-height:1.2}
    .pillar .ji{font-size:22px;font-weight:700;line-height:1.2;margin-top:2px}
    .pillar .element{font-size:11px;margin-top:6px;padding:2px 8px;border-radius:999px;display:inline-block}
    .pillar .sipsin{font-size:10px;margin-top:4px;color:var(--muted)}
    .el-wood{background:rgba(76,175,80,.2);color:#4caf50}.el-fire{background:rgba(244,67,54,.2);color:#e53935}.el-earth{background:rgba(255,193,7,.2);color:#f9a825}.el-metal{background:rgba(158,158,158,.2);color:#9e9e9e}.el-water{background:rgba(33,150,243,.2);color:#1e88e5}
    [data-theme="dark"] .el-wood{color:#81c784}[data-theme="dark"] .el-fire{color:#e57373}[data-theme="dark"] .el-earth{color:#ffd54f}[data-theme="dark"] .el-metal{color:#e0e0e0}[data-theme="dark"] .el-water{color:#64b5f6}
    .info-card{background:var(--highlight);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;line-height:1.8;font-size:14px;white-space:pre-wrap}
    .element-summary{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
    .el-tag{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600}
    .lunar-note{font-size:12px;color:var(--muted);margin-top:6px;font-style:italic}
    .luck-bar-wrap{display:flex;align-items:center;gap:12px;margin:8px 0}
    .luck-bar{flex:1;height:14px;border-radius:7px;background:var(--luck-bar-bg);overflow:hidden}
    .luck-bar-fill{height:100%;border-radius:7px;transition:width .6s}
    .luck-score{font-size:20px;font-weight:800;min-width:50px;text-align:right}
    .compat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .compat-card{background:var(--highlight);border:1px solid var(--line);border-radius:12px;padding:12px;line-height:1.6;font-size:13px;white-space:pre-wrap}
    .compat-card .cc-title{font-weight:700;font-size:14px;margin-bottom:4px}
    .good{color:#4caf50}.bad{color:#e57373}
    [data-theme="light"] .good{color:#2e7d32}[data-theme="light"] .bad{color:#c62828}
    .music-box{margin-top:14px;padding:14px;background:var(--music-bg);border:1px solid var(--music-line);border-radius:14px}
    .music-box h3{margin:0 0 10px;font-size:15px}
    .song-list{list-style:none;padding:0;margin:0}
    .song-list li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;display:flex;align-items:center;gap:8px}
    .song-list li:last-child{border-bottom:none}
    .song-list a{color:var(--link);text-decoration:none}
    .song-list a:hover{text-decoration:underline}
    .play-btn{border:none;background:var(--accent);color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;width:auto;margin:0;font-weight:600}
    .player-wrap{margin-top:12px;border-radius:12px;overflow:hidden;position:relative;padding-bottom:56.25%;height:0}
    .player-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
    .vs-wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;margin:16px 0}
    .vs-label{font-size:28px;font-weight:800;color:var(--accent);align-self:center;text-align:center}
    .compat-score-wrap{text-align:center;margin:16px 0}
    .compat-big-score{font-size:48px;font-weight:800}
    .compat-grade{font-size:16px;color:var(--muted);margin-top:4px}
    .compat-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    /* Fortune buttons */
    .fortune-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
    .fortune-btn{border:none;border-radius:12px;padding:14px 8px;background:var(--fortune-bg);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition: all 0.3s ease;width:auto;margin:0}
    .fortune-btn:hover{background:var(--fortune-hover);transform:translateY(-2px)}
    .fortune-btn.active{background:var(--accent);color:#fff}
    .fortune-btn .f-icon{font-size:24px;display:block;margin-bottom:4px}
    .fortune-content{margin-top:12px;display:none}
    .fortune-content.active{display:block}
    @media(max-width:600px){body{padding:10px}.card{padding:18px}.top-bar{flex-direction:column;align-items:flex-start;gap:10px}.form-grid{grid-template-columns:1fr 1fr}.compat-grid,.compat-detail-grid{grid-template-columns:1fr}.vs-wrap{grid-template-columns:1fr;text-align:center}.pillar-wrap{gap:8px}.pillar{min-width:75px;padding:10px 12px}.pillar .gan,.pillar .ji{font-size:20px}.fortune-grid{grid-template-columns:repeat(3,1fr)}}
    footer{margin-top:20px;padding:20px;text-align:center;font-size:12px;color:var(--muted)}
    footer a{color:var(--muted);text-decoration:none}
    footer a:hover{text-decoration:underline}
    footer nav{margin-top:8px}
  </style>
</head>
<body>
<div class="card">
  <div class="top-bar">
    <h1>사주풀이 + 노래 추천</h1>
    <button class="theme-toggle" id="themeToggle">라이트 모드</button>
  </div>
  <div class="subtitle">사주팔자를 깊이 있게 분석하고, 어울리는 노래까지 자동 재생해드려요.</div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="tabMain">내 사주</button>
    <button class="tab-btn" data-tab="tabCompat">궁합 보기</button>
  </div>

  <!-- 탭1: 내 사주 -->
  <div class="tab-pane active" id="tabMain">
    <div class="form-grid">
      <div class="form-group"><label>년도</label><input type="number" id="bY" placeholder="예: 1995" min="1900" max="2100"/></div>
      <div class="form-group"><label>월</label><select id="bM"><option value="">선택</option><option value="1">1월</option><option value="2">2월</option><option value="3">3월</option><option value="4">4월</option><option value="5">5월</option><option value="6">6월</option><option value="7">7월</option><option value="8">8월</option><option value="9">9월</option><option value="10">10월</option><option value="11">11월</option><option value="12">12월</option></select></div>
      <div class="form-group"><label>일</label><select id="bD"><option value="">선택</option></select></div>
      <div class="form-group full"><label>양력 / 음력</label><div class="calendar-row"><label><input type="radio" name="cal" value="solar" checked/> 양력</label><label><input type="radio" name="cal" value="lunar"/> 음력</label></div></div>
      <div class="form-group full"><label>태어난 시간</label><select id="bT"><option value="">선택해주세요</option><option value="0">자시 (23:00~01:00)</option><option value="1">축시 (01:00~03:00)</option><option value="2">인시 (03:00~05:00)</option><option value="3">묘시 (05:00~07:00)</option><option value="4">진시 (07:00~09:00)</option><option value="5">사시 (09:00~11:00)</option><option value="6">오시 (11:00~13:00)</option><option value="7">미시 (13:00~15:00)</option><option value="8">신시 (15:00~17:00)</option><option value="9">유시 (17:00~19:00)</option><option value="10">술시 (19:00~21:00)</option><option value="11">해시 (21:00~23:00)</option><option value="-1">모름</option></select></div>
      <div class="form-group full"><label>태어난 지역</label><input type="text" id="bP" placeholder="예: 서울, 부산, 대구, 인천..."/></div>
      <div class="form-group full"><label>성별</label><div class="calendar-row"><label><input type="radio" name="gender" value="male" checked/> 남자</label><label><input type="radio" name="gender" value="female"/> 여자</label></div></div>
      <div class="form-group full"><label>궁금한 질문 (선택)</label><textarea id="bQ" rows="2" placeholder="예: 올해 재물운은 어떨까요?"></textarea></div>
    </div>
    <button id="btnGo">사주 분석하기</button>
    <div class="err" id="errBox"></div>
    <div id="result" style="display:none"></div>
  </div>

  <!-- 탭2: 궁합 -->
  <div class="tab-pane" id="tabCompat">
    <div class="vs-wrap">
      <div>
        <div style="font-weight:700;margin-bottom:8px;color:var(--section-title)">나</div>
        <div class="form-grid" style="grid-template-columns:1fr 1fr">
          <div class="form-group"><label>년도</label><input type="number" id="cY1" placeholder="1995" min="1900" max="2100"/></div>
          <div class="form-group"><label>월</label><select id="cM1"><option value="">선택</option><option value="1">1월</option><option value="2">2월</option><option value="3">3월</option><option value="4">4월</option><option value="5">5월</option><option value="6">6월</option><option value="7">7월</option><option value="8">8월</option><option value="9">9월</option><option value="10">10월</option><option value="11">11월</option><option value="12">12월</option></select></div>
          <div class="form-group"><label>일</label><select id="cD1"><option value="">선택</option></select></div>
          <div class="form-group"><label>시간</label><select id="cT1"><option value="">선택</option><option value="0">자시 (23~01시)</option><option value="1">축시 (01~03시)</option><option value="2">인시 (03~05시)</option><option value="3">묘시 (05~07시)</option><option value="4">진시 (07~09시)</option><option value="5">사시 (09~11시)</option><option value="6">오시 (11~13시)</option><option value="7">미시 (13~15시)</option><option value="8">신시 (15~17시)</option><option value="9">유시 (17~19시)</option><option value="10">술시 (19~21시)</option><option value="11">해시 (21~23시)</option><option value="-1">모름</option></select></div>
        </div>
      </div>
      <div class="vs-label">VS</div>
      <div>
        <div style="font-weight:700;margin-bottom:8px;color:var(--section-title)">상대</div>
        <div class="form-grid" style="grid-template-columns:1fr 1fr">
          <div class="form-group"><label>년도</label><input type="number" id="cY2" placeholder="1997" min="1900" max="2100"/></div>
          <div class="form-group"><label>월</label><select id="cM2"><option value="">선택</option><option value="1">1월</option><option value="2">2월</option><option value="3">3월</option><option value="4">4월</option><option value="5">5월</option><option value="6">6월</option><option value="7">7월</option><option value="8">8월</option><option value="9">9월</option><option value="10">10월</option><option value="11">11월</option><option value="12">12월</option></select></div>
          <div class="form-group"><label>일</label><select id="cD2"><option value="">선택</option></select></div>
          <div class="form-group"><label>시간</label><select id="cT2"><option value="">선택</option><option value="0">자시 (23~01시)</option><option value="1">축시 (01~03시)</option><option value="2">인시 (03~05시)</option><option value="3">묘시 (05~07시)</option><option value="4">진시 (07~09시)</option><option value="5">사시 (09~11시)</option><option value="6">오시 (11~13시)</option><option value="7">미시 (13~15시)</option><option value="8">신시 (15~17시)</option><option value="9">유시 (17~19시)</option><option value="10">술시 (19~21시)</option><option value="11">해시 (21~23시)</option><option value="-1">모름</option></select></div>
        </div>
      </div>
    <div class="form-group full" style="grid-column: 1 / -1; margin-top: 10px;"><label>궁금한 질문 (선택)</label><textarea id="cQ" rows="2" placeholder="예: 저희의 전반적인 궁합이 궁금해요."></textarea></div>
    </div>
    <button id="btnCompat">궁합 분석하기</button>
    <div class="err" id="errBox2"></div>
    <div id="compatResult" style="display:none"></div>
  </div>
</div>
  <footer>
    <p>&copy; 2023 사주풀이 + 노래 추천. All rights reserved.</p>
    <nav>
      <a href="/privacy-policy.html">개인정보처리방침</a> |
      <a href="/contact.html">문의하기</a>
    </nav>
    <div id="lastModified" style="font-size: 10px; margin-top: 10px;"></div>
  </footer>
<script src="script.js?v=2" defer></script>
</body>
</html>
